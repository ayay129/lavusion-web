<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>览悟找图 · 相似图片</title>
  <script src="../local-fabric-match/assets/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f5f7; }
    body { color: #111114; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
    #main { position: absolute; left: 50%; top: 50%; width: 1200px; height: 810px; transform: translate(-50%, -50%) scale(var(--fit-scale, 1)); transform-origin: center; }
    .scene-content { width: 100%; height: 100%; padding: 60px; display: flex; align-items: center; justify-content: center; gap: 16px; }
    .query { flex: 0 0 260px; display: flex; flex-direction: column; align-items: center; gap: 17px; }
    .query-frame { width: 260px; height: 260px; padding: 7px; border: 1.5px solid #71364c; border-radius: 20px; background: #fff; box-shadow: 0 18px 45px #1111140b; }
    .query img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 13px; }
    .query-label { font-size: 26px; font-weight: 550; letter-spacing: .015em; }
    .connector { flex: 0 0 64px; height: 2px; background: #71364c; transform-origin: left center; position: relative; }
    .connector::after { content: ''; position: absolute; right: 0; top: -5px; width: 10px; height: 10px; border-top: 2px solid #71364c; border-right: 2px solid #71364c; transform: rotate(45deg); }
    .results { flex: 0 0 614px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    .results-label { color: #6e6e73; font-size: 26px; line-height: 34px; font-weight: 450; }
    .cards { display: grid; grid-template-columns: repeat(2, 301px); gap: 12px; }
    .card { position: relative; width: 301px; height: 301px; overflow: hidden; border: 7px solid #fff; border-radius: 19px; background: #fff; box-shadow: 0 12px 30px #11111408; }
    .fabric { display: block; width: 100%; height: 100%; border-radius: 11px; object-fit: cover; object-position: center 42%; }
    .score { position: absolute; right: 10px; bottom: 10px; min-width: 83px; display: flex; align-items: baseline; justify-content: center; gap: 5px; padding: 7px 10px; border: 1px solid #e9e6e7; border-radius: 999px; background: rgba(255,255,255,.95); color: #71364c; box-shadow: 0 3px 12px #11111414; white-space: nowrap; }
    .score span { color: #6e6e73; font-size: 14px; }
    .score strong { font-size: 25px; font-weight: 650; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    @media (max-width: 440px) {
      #main { left: 0; top: 0; width: 100vw; height: 100vh; transform: none; }
      .scene-content { padding: 12px; gap: 8px; }
      .query { flex: 0 0 42%; min-width: 0; gap: 8px; }
      .query-frame { width: 100%; height: auto; aspect-ratio: 1; padding: 4px; border-radius: 13px; }
      .query img { border-radius: 8px; }
      .query-label, .results-label { font-size: 14px; line-height: 18px; }
      .connector { display: none; }
      .results { flex: 1 1 auto; min-width: 0; gap: 7px; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .card { width: 100%; height: auto; aspect-ratio: 1; border-width: 4px; border-radius: 10px; }
      .fabric { border-radius: 6px; }
      .score { right: 3px; bottom: 3px; min-width: 0; gap: 2px; padding: 3px 5px; }
      .score span { font-size: 7px; }
      .score strong { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="main" data-composition-id="main" data-start="0" data-duration="8" data-width="1200" data-height="810">
    <div class="scene-content">
      <div class="query">
        <div class="query-frame"><img src="assets/query.png" alt="用于搜索的红玫瑰布料"></div>
        <div class="query-label">搜索图片</div>
      </div>
      <div class="connector" aria-hidden="true"></div>
      <div class="results">
        <div class="results-label">相似结果</div>
        <div class="cards">
          <div class="card"><img class="fabric" src="assets/result-01.jpg" alt="第一张实际搜索结果"><div class="score"><span>相似度</span><strong>97%</strong></div></div>
          <div class="card"><img class="fabric" src="assets/result-02.jpg" alt="第二张实际搜索结果"><div class="score"><span>相似度</span><strong>92%</strong></div></div>
          <div class="card"><img class="fabric" src="assets/result-03.jpg" alt="第三张实际搜索结果"><div class="score"><span>相似度</span><strong>89%</strong></div></div>
          <div class="card"><img class="fabric" src="assets/result-04.jpg" alt="第四张实际搜索结果"><div class="score"><span>相似度</span><strong>89%</strong></div></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const composition = document.querySelector('#main');
    const fitComposition = () => {
      const compact = window.innerWidth < 440;
      composition.classList.toggle('compact', compact);
      if (!compact) document.documentElement.style.setProperty('--fit-scale', String(Math.min(window.innerWidth / 1200, window.innerHeight / 810)));
    };
    fitComposition();
    window.addEventListener('resize', fitComposition);

    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.from('.query-frame', { opacity: 0, scale: .92, duration: .65, ease: 'power3.out' }, .15);
    tl.from('.query-label', { opacity: 0, y: 8, duration: .45, ease: 'sine.out' }, .4);
    tl.from('.query', { x: 130, scale: 1.14, duration: .9, ease: 'power3.inOut' }, 1.2);
    tl.from('.connector', { scaleX: 0, opacity: 0, duration: .45, ease: 'power1.out' }, 1.75);
    tl.from('.results-label', { opacity: 0, x: 10, duration: .45, ease: 'sine.out' }, 1.95);
    tl.from('.card', { opacity: 0, y: 28, scale: .96, duration: .7, stagger: { each: .16, from: 'start' }, ease: 'power3.out' }, 2.1);
    tl.from('.score', { opacity: 0, y: 6, duration: .35, stagger: .12, ease: 'circ.out' }, 2.7);
    window.__timelines.main = tl;
    if (location.protocol === 'file:' || window.parent === window) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) tl.seek(8);
      else tl.play(0);
    }
  </script>
</body>
</html>
